<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The First — branch flow</title>
<style>
*{box-sizing:border-box}
:root{
  --void:#070B11; --deep:#0C1219; --panel:#111A24; --edge:#1C2938;
  --line:#24384B;
  --ink:#C9D8E4; --mute:#6E8499; --faint:#3E5163;
  --cy:#4FD2E8; --cy-dim:#1F6E80;
  --hot:#E0574B; --warm:#D89A4A; --cool:#5C8FD6; --grn:#5FB98A; --vio:#9B7FD4;
}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:26px;
  padding:14px 22px;border-bottom:1px solid var(--edge);background:var(--deep);z-index:30}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand b{font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.brand span{font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}

.who{display:flex;gap:0;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.who button{appearance:none;background:transparent;border:0;color:var(--mute);
  font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:8px 16px;cursor:pointer;transition:background .15s,color .15s}
.who button+button{border-left:1px solid var(--edge)}
.who button[aria-pressed="true"]{background:var(--cy-dim);color:#EAF9FD}
.who button:hover:not([aria-pressed="true"]){color:var(--ink);background:#16222E}
.who button:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}

.readout{display:flex;gap:22px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat u{text-decoration:none;font-size:9px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.stat b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.meter{width:190px}
.meter .track{height:5px;background:#16222E;border:1px solid var(--edge);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;
  background:linear-gradient(90deg,var(--warm),var(--hot));transition:width .35s ease}
.meter .cap{display:flex;justify-content:space-between;margin-top:5px}
.meter .cap u{text-decoration:none;font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.meter .cap b{font-size:11px;font-variant-numeric:tabular-nums;color:var(--warm)}

.stage{flex:1 1 auto;display:flex;min-height:0}
.scroller{flex:1 1 auto;overflow:auto;position:relative;padding:0 30px 40px}
.grid{position:relative;display:flex;gap:34px;align-items:flex-start;width:max-content;padding-top:12px}
svg.wires{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}

.col{position:relative;z-index:2;width:186px;display:flex;flex-direction:column;gap:9px}
.colhead{position:sticky;top:0;background:var(--void);padding:10px 0 12px;z-index:5}
.colhead i{display:block;font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--cy-dim);font-weight:700}
.colhead span{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--mute);
  text-transform:uppercase;margin-top:4px}
.colhead hr{border:0;border-top:1px solid var(--edge);margin:9px 0 0}

.cell{position:relative;width:100%;text-align:left;appearance:none;cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-left:2px solid var(--faint);
  border-radius:2px;padding:9px 10px 9px 11px;color:var(--ink);font:inherit;
  transition:border-color .15s,background .15s,opacity .2s,transform .12s}
.cell:hover{background:#16222E;transform:translateX(2px)}
.cell:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.cell .nm{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;line-height:1.35}
.cell .mt{display:flex;align-items:center;gap:6px;margin-top:6px}
.cell .mt em{font-style:normal;font-size:8.5px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.cell .cost{margin-left:auto;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.up .cost{color:var(--hot)} .cell.dn .cost{color:var(--grn)}

.cell[data-emo="Angry"]{border-left-color:var(--hot)}
.cell[data-emo="Upset"]{border-left-color:var(--warm)}
.cell[data-emo="Crying"]{border-left-color:var(--vio)}
.cell[data-emo="Happy"]{border-left-color:var(--grn)}
.cell[data-emo="Determined"]{border-left-color:var(--cy)}
.cell[data-emo="Confused"]{border-left-color:var(--cool)}
.cell[data-emo="Normal"]{border-left-color:var(--faint)}

.cell.ending{background:#0E1720;border-style:dashed}
.cell.ending .nm:after{content:" ▸ END";color:var(--cy-dim);font-size:8.5px;letter-spacing:.14em}
.cell.hide{display:none}
.cell.faded{opacity:.17}
.cell.lit{background:#17303A;border-color:var(--cy);box-shadow:0 0 0 1px var(--cy-dim)}
.cell.head{background:#1B3C48;border-color:var(--cy)}

.side{flex:0 0 314px;border-left:1px solid var(--edge);background:var(--deep);
  overflow-y:auto;padding:18px 18px 30px}
.side h2{margin:0 0 3px;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.side .sub{font-size:9.5px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-bottom:16px}
.side .body{font-size:12.5px;line-height:1.6;color:var(--mute);margin:0 0 16px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin-bottom:18px}
.kv u{text-decoration:none;font-size:9px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;padding-top:2px}
.kv b{font-size:11.5px;font-weight:600}
.sec{font-size:9px;letter-spacing:.18em;color:var(--cy-dim);text-transform:uppercase;
  font-weight:700;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--edge)}
.route{list-style:none;margin:0 0 20px;padding:0;counter-reset:r}
.route li{position:relative;padding:0 0 11px 22px;font-size:11px;line-height:1.5;color:var(--mute)}
.route li:before{counter-increment:r;content:counter(r,decimal-leading-zero);
  position:absolute;left:0;top:1px;font-size:8.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.route li:after{content:"";position:absolute;left:5px;top:15px;bottom:1px;width:1px;background:var(--edge)}
.route li:last-child:after{display:none}
.route li b{display:block;color:var(--ink);font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.route li i{font-style:normal;float:right;font-variant-numeric:tabular-nums;font-size:10px}
.route li i.up{color:var(--hot)} .route li i.dn{color:var(--grn)}
.branch{list-style:none;margin:0;padding:0}
.branch li{margin-bottom:7px}
.branch button{width:100%;text-align:left;appearance:none;cursor:pointer;background:var(--panel);
  border:1px solid var(--edge);border-radius:2px;padding:8px 10px;color:var(--mute);
  font:inherit;font-size:11px;line-height:1.45;transition:border-color .15s,color .15s}
.branch button:hover{border-color:var(--cy-dim);color:var(--ink)}
.branch button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.empty{font-size:11.5px;line-height:1.6;color:var(--faint)}

.legend{display:flex;flex-wrap:wrap;gap:9px 14px;padding:9px 22px;
  border-top:1px solid var(--edge);background:var(--deep);flex:0 0 auto}
.legend span{display:flex;align-items:center;gap:6px;font-size:9px;
  letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.legend i{width:9px;height:2px;display:block}

@media (max-width:900px){
  .side{display:none}
  .topbar{flex-wrap:wrap;gap:14px}
  .readout{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style></head><body>

<header class="topbar">
  <div class="brand"><b>The First</b><span>Branch flow &middot; 206 beats</span></div>

</header>

<div class="stage">

</div>

<footer class="legend">

</footer>

false,"who":"lai"},"LAILA_DOOR_SHORT":{"id":"LAILA_DOOR_SHORT","label":"DOOR SHORT","sp":"Laila","emo":"Normal","scene":"Bedroom Night","words":27,"d":10,"delta":0,"kids":[["Go inside.","LAILA_HOME_EVENING"]],"par":[["LAILA_DOORSTEP","The short version."]],"end":false,"who":"lai"},"LAILA_DOOR_REAL":{"id":"LAILA_DOOR_REAL","label":"DOOR REAL","sp":"Laila","emo":"Crying","scene":"Bedroom Night","words":32,"d":10,"delta":8,"kids":[["Go inside.","LAILA_HOME_EVENING"]],"par":[["LAILA_DOORSTEP","The real one."]],"end":false,"who":"lai"}},"beats":{"0":["00","Who are you"],"1":["01","The kitchen, 6:40"],"2":["02","How you left"],"3":["03","What you tell her"],"4":["04","Arrival"],"5":["05","The situation"],"6":["06","What you do"],"7":["07","What it costs"],"8":["08","Last bell"],"9":["09","The walk"],"10":["10","The doorstep"],"11":["11","Which version"],"12":["12","Evening"]},"maxd":12};
const N = G.nodes;
let who = 'mel';
let sel = null;

const EMO_C = {Angry:'--hot',Upset:'--warm',Crying:'--vio',Happy:'--grn',
               Determined:'--cy',Confused:'--cool',Normal:'--faint'};

const grid = document.getElementById('grid');
const wires = document.getElementById('wires');

function visible(id){
  const w = N[id].who;
  return w === 'both' || w === who;
}

function build(){
  grid.querySelectorAll('.col').forEach(c => c.remove());
  const cols = [];
  for(let d=0; d<=G.maxd; d++){
    const ids = Object.keys(N).filter(k => N[k].d === d && visible(k));
    if(!ids.length){ cols.push(null); continue; }
    ids.sort((a,b) => N[a].label.localeCompare(N[b].label));
    const col = document.createElement('div');
    col.className = 'col';
    const beat = G.beats[String(d)] || [String(d),''];
    const head = document.createElement('div');
    head.className = 'colhead';
    head.innerHTML = '<i>'+beat[0]+'</i><span>'+beat[1]+'</span><hr>';
    col.appendChild(head);
    ids.forEach(id => col.appendChild(cell(id)));
    grid.appendChild(col);
    cols.push(col);
  }
  requestAnimationFrame(drawWires);
}

function cell(id){
  const n = N[id];
  const b = document.createElement('button');
  b.className = 'cell' + (n.end ? ' ending' : '') +
                (n.delta > 0 ? ' up' : (n.delta < 0 ? ' dn' : ''));
  b.dataset.id = id;
  b.dataset.emo = n.emo || 'Normal';
  b.setAttribute('aria-label', n.label + ', ' + (n.scene||''));
  const cost = n.delta === 0 ? '' :
    '<span class="cost">' + (n.delta>0?'+':'') + n.delta + '</span>';
  b.innerHTML = '<span class="nm">'+esc(n.label)+'</span>' +
    '<span class="mt"><em>'+esc(n.scene)+'</em>'+cost+'</span>';
  b.addEventListener('click', () => { sel = id; paint(); });
  return b;
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* shortest route ROOT -> id, following real parent links */
function route(id){
  if(!id) return [];
  const prev = {}, seen = new Set(['ROOT']);
  const q = ['ROOT'];
  let h = 0;
  while(h < q.length){
    const cur = q[h++];
    if(cur === id) break;
    for(const [txt,t] of N[cur].kids){
      if(!N[t] || seen.has(t) || !visible(t)) continue;
      seen.add(t); prev[t] = [cur,txt]; q.push(t);
    }
  }
  if(id !== 'ROOT' && !prev[id]) return [];
  const out = [];
  let cur = id;
  while(cur !== 'ROOT'){
    const p = prev[cur];
    if(!p) break;
    out.unshift({id:cur, via:p[1], from:p[0]});
    cur = p[0];
  }
  out.unshift({id:'ROOT', via:null, from:null});
  return out;
}

function paint(){
  const path = route(sel);
  const ids = new Set(path.map(p => p.id));
  document.querySelectorAll('.cell').forEach(c => {
    const on = ids.has(c.dataset.id);
    c.classList.toggle('lit', on && c.dataset.id !== sel);
    c.classList.toggle('head', c.dataset.id === sel);
    c.classList.toggle('faded', sel !== null && !on);
  });
  let anger = 0;
  path.forEach(p => { anger = Math.max(0, Math.min(100, anger + N[p.id].delta)); });
  document.getElementById('fill').style.width = anger + '%';
  document.getElementById('angerVal').textContent = Math.round(anger);
  document.getElementById('steps').textContent = path.length ? path.length - 1 : '—';
  side(path, anger);
  drawWires(ids);
}

function side(path, anger){
  const el = document.getElementById('side');
  if(!sel){
    el.innerHTML = '<h2>No branch selected</h2>' +
      '<div class="sub">' + countVisible() + ' nodes in view</div>' +
      '<p class="empty">Pick any box to trace the route back to the start. ' +
      'The meter above totals the anger cost of every beat along that route.</p>';
    return;
  }
  const n = N[sel];
  const kids = n.kids.filter(k => N[k[1]] && visible(k[1]));
  let h = '<h2>' + esc(n.label) + '</h2>' +
    '<div class="sub">' + esc(n.scene) + ' &middot; ' + esc(n.sp) + '</div>';
  h += '<div class="kv">' +
    '<u>Emotion</u><b>' + esc(n.emo || '—') + '</b>' +
    '<u>Anger</u><b style="color:var(' + (n.delta>0?'--hot':(n.delta<0?'--grn':'--faint')) + ')">' +
      (n.delta>0?'+':'') + n.delta + '</b>' +
    '<u>Running</u><b>' + Math.round(anger) + ' / 100</b>' +
    '<u>Words</u><b>' + n.words + '</b>' +
    '</div>';
  h += '<p class="sec">Route from start</p><ol class="route">';
  path.forEach(p => {
    const nn = N[p.id];
    const d = nn.delta;
    const tag = d === 0 ? '' :
      '<i class="' + (d>0?'up':'dn') + '">' + (d>0?'+':'') + d + '</i>';
    h += '<li>' + tag + '<b>' + esc(nn.label) + '</b>' +
         (p.via ? esc(p.via) : 'Opening beat') + '</li>';
  });
  h += '</ol>';
  if(kids.length){
    h += '<p class="sec">Leads to</p><ul class="branch">';
    kids.forEach(([txt,t]) => {
      h += '<li><button data-go="' + t + '">' + esc(txt) + '</button></li>';
    });
    h += '</ul>';
  } else {
    h += '<p class="sec">Ending</p><p class="empty">This is a terminal beat. ' +
         'The widget offers Start Over and Leave here.</p>';
  }
  el.innerHTML = h;
  el.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => {
      sel = b.dataset.go; paint();
      const t = document.querySelector('.cell[data-id="'+sel+'"]');
      if(t) t.scrollIntoView({block:'nearest',inline:'center',
        behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto':'smooth'});
    }));
}

function countVisible(){ return Object.keys(N).filter(visible).length; }

function drawWires(litSet){
  const box = grid.getBoundingClientRect();
  wires.setAttribute('width', grid.offsetWidth);
  wires.setAttribute('height', grid.offsetHeight);
  const pos = {};
  document.querySelectorAll('.cell').forEach(c => {
    const r = c.getBoundingClientRect();
    pos[c.dataset.id] = {
      x1: r.left - box.left, x2: r.right - box.left,
      y: r.top - box.top + r.height/2
    };
  });
  let d = '', lit = '';
  Object.keys(N).forEach(id => {
    if(!visible(id) || !pos[id]) return;
    N[id].kids.forEach(([txt,t]) => {
      if(!pos[t]) return;
      const a = pos[id], b = pos[t];
      if(b.x1 < a.x2) return;               // skip backward links
      const mx = a.x2 + (b.x1 - a.x2) * 0.5;
      const seg = 'M' + a.x2 + ',' + a.y +
                  'C' + mx + ',' + a.y + ' ' + mx + ',' + b.y + ' ' + b.x1 + ',' + b.y;
      if(litSet && litSet.has(id) && litSet.has(t)) lit += seg; else d += seg;
    });
  });
  wires.innerHTML =
    '<path d="' + d + '" fill="none" stroke="var(--line)" stroke-width="1" ' +
      'opacity="' + (litSet && litSet.size ? .22 : .62) + '"/>' +
    '<path d="' + lit + '" fill="none" stroke="var(--cy)" stroke-width="1.6" opacity=".95"/>';
}

document.querySelectorAll('.who button').forEach(b =>
  b.addEventListener('click', () => {
    who = b.dataset.who;
    document.querySelectorAll('.who button').forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    sel = null;
    build();
    paint();
  }));

document.getElementById('reset').addEventListener('click', () => { sel = null; paint(); });

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => drawWires(sel ? new Set(route(sel).map(p=>p.id)) : null), 140);
});
document.querySelector('.scroller').addEventListener('scroll', () => {
  clearTimeout(rt);
  rt = setTimeout(() => drawWires(sel ? new Set(route(sel).map(p=>p.id)) : null), 60);
});

build();
paint();
</script></body></html>
